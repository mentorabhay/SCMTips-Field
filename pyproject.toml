[project]
name = "scmtips-field-monorepo"
version = "0.1.0"
description = "SCMTIPS Field Workspace"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "asyncpg>=0.30.0",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    "pyjwt[crypto]>=2.9.0",
    "cryptography>=43.0.3",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.115.0",
    "schemathesis>=3.25.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-pyjwt>=1.7.1",
    "types-cryptography>=3.3.23",
    "playwright>=1.64.1",
]

[tool.uv.workspace]
members = [
    "services/field-api",
    "services/field-worker",
    "services/erp-sim",
    "connectors/sap",
    "compat",
    "tools/fake-core",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501", "B008", "SIM117", "N815", "A002", "B904", "N803", "B007", "SIM102", "SIM115", "B017", "N806", "N818"]

[tool.mypy]
python_version = "3.13"
strict = true
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
mypy_path = [
    "services/field-api/src",
    "services/field-worker/src",
    "services/erp-sim/src",
    "connectors/sap/src",
    "tools/fake-core/src",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
pythonpath = [
    "services/field-api/src",
    "services/field-worker/src",
    "services/erp-sim/src",
    "connectors/sap/src",
    "tools/fake-core/src",
]
markers = [
    "unit: Unit tests",
    "property: Property-based tests (Hypothesis)",
    "integration: Integration tests",
    "contract: Contract verification tests",
    "compat: Core contract compatibility tests",
]
asyncio_mode = "auto"
