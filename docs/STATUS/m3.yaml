  - apps/field-android/app/src/test/kotlin/com/scmtips/field/app/jobs/BarcodeSandboxTest.kt::anUnknownCodeOnAProductionSiteIsRefusedAsBefore
  - apps/field-android/app/src/test/kotlin/com/scmtips/field/app/jobs/BarcodeSandboxTest.kt::refreshedLinesAreMergedProgressIsKeptAndTheFocusCodeSelectsTheNewLine
  - apps/field-android/app/src/test/kotlin/com/scmtips/field/app/jobs/BarcodeSandboxTest.kt::theJobStateNamesTheStep
  - apps/field-android/app/src/test/kotlin/com/scmtips/field/app/assistant/SiteModesTest.kt::parsesTheSiteListAndTheCodeLookup
  - apps/field-android/app/src/test/kotlin/com/scmtips/field/app/assistant/SiteModesTest.kt::sandboxIsAskedOnceThenRemembered
  - apps/field-android/app/src/test/kotlin/com/scmtips/field/app/assistant/SiteModesTest.kt::productionOrNoAnswerRefusesNewItems
  - apps/field-android/app/src/test/kotlin/com/scmtips/field/app/session/ConductorTest.kt::anUnknownCodeGoesToTheAssistantWithAGlassesPhoto
  - apps/field-android/app/src/test/kotlin/com/scmtips/field/app/session/ConductorTest.kt::theSameUnknownCodeIsAskedAboutOnceAMinute
  - apps/field-android/app/src/test/kotlin/com/scmtips/field/app/session/ConductorTest.kt::openTaskAndRefreshTaskGoToTheDeskAndTheRunnersWordsQueueAfterTheAssistants
  frs: []
  verified_at: null
  note: 'TaskParser reads line `barcodes` (contract §2; absent = empty, so an older field-api still works); receive,
    count, put-away and pick product scans match the material OR any barcode, and the pick product confirmation sends
    the scanned code as is (the server matches either). A code on no line of a receive/count job goes to the sandbox
    handler: during a work session on a site whose mode (GET /v1/sites `mode`, else `site_mode` of
    GET /v1/codes/{code}) is sandbox it becomes an `unknown_code` turn with a glasses JPEG (scaled to 1280 px, at most
    1 MB, base64), once per code per minute; otherwise (production, unknown mode, no session) it is refused as before.
    refresh_task re-reads GET /v1/tasks and merges the task into the open job without losing progress, then handles
    focus_code as a scan. Track S''s endpoints and line fields do not exist on this branch; tested with doubles only.'
