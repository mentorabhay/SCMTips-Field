  frs:
  - FR2.032
  verified_at: null
  note: 'Coded against contract §4 (POST /v1/assistant/turns, all nine events, actions open_task / command / refresh_task
    / listen); the endpoint does not exist on this branch (track A), so every test uses a scripted assistant in test
    code. The confirm rule holds three times: the parser has no confirm command, the conductor refuses any other
    command name, and JobRunner refuses Spoken(Yes); commands run only in reply to the operator''s own words, and a
    "post" from words below the 0.80 floor is not staged. Phone-side choices beyond the contract: words below 0.40
    confidence are dropped as noise; "stop work" is always local; yes/no with no post waiting and everything after a
    listen=free reply go to the assistant; assistant failure falls back to the grammar plus one spoken hint, and
    outside a job to local "start <job type>" / "what''s next". Not run against track A''s server or the real model.'
- id: M3-P03
  title: Scan by looking — glasses video frames decoded on the phone, two-frame rule, no repeat within 3 s
  status: partial
  evidence:
  - apps/field-android/app/src/main/kotlin/com/scmtips/field/app/scan/FrameScan.kt
  - apps/field-android/app/src/main/kotlin/com/scmtips/field/app/glasses/DatGlasses.kt
  - apps/field-android/app/src/main/kotlin/com/scmtips/field/app/device/DeviceIo.kt
  - apps/field-android/app/src/main/kotlin/com/scmtips/field/app/FieldController.kt
  tests:
  - apps/field-android/app/src/test/kotlin/com/scmtips/field/app/scan/FrameScanFilterTest.kt::aCodeInOneFrameIsNotAScanTwoConsecutiveFramesAre
  - apps/field-android/app/src/test/kotlin/com/scmtips/field/app/scan/FrameScanFilterTest.kt::aFrameWithoutTheCodeBreaksTheRun
  - apps/field-android/app/src/test/kotlin/com/scmtips/field/app/scan/FrameScanFilterTest.kt::theSameCodeIsNotReportedAgainWithinThreeSeconds
  - apps/field-android/app/src/test/kotlin/com/scmtips/field/app/scan/FrameScanFilterTest.kt::codesAreComparedTrimmedAndCaseInsensitiveAndEachIsTrackedOnItsOwn
  - apps/field-android/app/src/test/kotlin/com/scmtips/field/app/scan/FrameScanFilterTest.kt::resetNeedsTwoFreshFramesAndForgetsReports
  - apps/field-android/app/src/test/kotlin/com/scmtips/field/app/scan/FrameScanFilterTest.kt::i420BecomesNv21WithVuInterleaved
  frs: []
  verified_at: null
  note: 'The DAT camera stream (HIGH 720x1280, 2 fps, uncompressed) is open only during a work session or while a job
    scans with the glasses; capturePhoto opens it on demand (waits up to 8 s for STREAMING) and closes it again.
    Frames go to the phone only while the session is active and not paused, one decode at a time (busy frames are
    dropped), I420 -> NV21 -> ML Kit; inside a job only scan steps take them (bestOf picks the code the step can use),
    outside a job a scan is a `scan` turn. UNVERIFIED on the device: that DAT 1.0.1 decoded frames are tightly packed
    I420 (a padded buffer is skipped, so a wrong guess means no scans, never wrong ones), that closing and re-adding
    the camera capability works, decode time and battery. The capture button and "what is this" still take a full photo.'
