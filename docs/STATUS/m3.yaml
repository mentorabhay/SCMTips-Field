# M3 glasses-first slice ledger (owner amendment A-03; docs/design/M3_CONTRACT.md). Every entry is at most
# partial until proven on the owner's phone and glasses. Track P (phone + console) entries: M3-P01...
- id: M3-P01
  title: Work session — foreground service, continuous listening through the glasses, pause/resume with the DAT session
  status: partial
  evidence:
  - apps/field-android/app/src/main/kotlin/com/scmtips/field/app/session/WorkSession.kt
  - apps/field-android/app/src/main/kotlin/com/scmtips/field/app/session/WorkSessionService.kt
  - apps/field-android/app/src/main/kotlin/com/scmtips/field/app/device/DeviceIo.kt
  - apps/field-android/app/src/main/kotlin/com/scmtips/field/app/glasses/DatGlasses.kt
  - apps/field-android/app/src/main/kotlin/com/scmtips/field/app/FieldController.kt
  - apps/field-android/app/src/main/AndroidManifest.xml
  tests:
  - apps/field-android/app/src/test/kotlin/com/scmtips/field/app/session/WorkSessionTest.kt::listensOnlyInAnActiveUnpausedSessionAndNotWhileThePhoneSpeaks
  - apps/field-android/app/src/test/kotlin/com/scmtips/field/app/session/WorkSessionTest.kt::glassesPauseAndResumeTheSession
  - apps/field-android/app/src/test/kotlin/com/scmtips/field/app/session/WorkSessionTest.kt::aPhoneOnlySessionIsNotPausedByGlassesItNeverHad
  - apps/field-android/app/src/test/kotlin/com/scmtips/field/app/session/WorkSessionTest.kt::theOperatorsPauseIsLiftedOnlyByTheOperator
  - apps/field-android/app/src/test/kotlin/com/scmtips/field/app/session/WorkSessionTest.kt::glassesConnectingOutsideASessionOfferIt
  - apps/field-android/app/src/test/kotlin/com/scmtips/field/app/session/WorkSessionTest.kt::wordsAndListenModeAreKeptOnlyDuringASession
  - apps/field-android/app/src/test/kotlin/com/scmtips/field/app/session/WorkSessionTest.kt::glassesSpeechIsUsedOnlyWhenOnAndAcceptedByTheToolkit
  - apps/field-android/app/src/test/kotlin/com/scmtips/field/app/session/WorkSessionTest.kt::recogniserRestartsAtOnceAfterSilenceAndBacksOffOnErrors
  frs: []
  verified_at: null
  note: 'Start work on Today (microphone permission first) or the glasses connecting while the app is on screen
    (once per connection) start WorkSessionService (foregroundServiceType microphone|connectedDevice, FOREGROUND_SERVICE_*
    permissions declared; the microphone type only from Android 11). The microphone is the glasses'' own DAT speech
    when Me → Glasses microphone is on and the toolkit accepts it (started only in a session), else Android''s
    SpeechRecognizer restarted after every result/error with backoff, routed to the glasses as Bluetooth SCO via
    AudioManager.setCommunicationDevice (Android 12+; else the phone microphone); prompts then play as
    voice-communication audio. Listening is held while the phone speaks and while paused; DAT PAUSED pauses, STARTED
    resumes, a stop after the glasses took part pauses as disconnected. Outside a session nothing listens except the
    on-screen Hold to talk (A-03); glasses transcripts outside a session are dropped. The pure rules are JVM-tested;
    the service, recogniser loop, SCO routing and DAT calls are type-checked only (compile_check --all) and lint has
    not run here (no Android SDK licence). Nothing has run on the owner''s phone or glasses: whether Android''s
    recogniser really hears through SCO on his phone, and how often it beeps on restart, is unknown.'
