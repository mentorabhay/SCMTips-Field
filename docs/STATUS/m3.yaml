- id: M3-P01
  title: Work session — foreground service, continuous listening through the glasses, pause/resume with the DAT session
  status: partial
  evidence:
  - apps/field-android/app/src/main/kotlin/com/scmtips/field/app/session/WorkSession.kt
  - apps/field-android/app/src/main/kotlin/com/scmtips/field/app/session/WorkSessionService.kt
  - apps/field-android/app/src/main/kotlin/com/scmtips/field/app/device/DeviceIo.kt
