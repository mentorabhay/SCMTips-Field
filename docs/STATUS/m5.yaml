  - apps/field-android/app/src/test/kotlin/com/scmtips/field/app/look/LookClientTest.kt::m5B03_aPersonWhoDoesNotDecideClaimsGetsNoList
  - apps/field-android/app/src/test/kotlin/com/scmtips/field/app/jobs/M5GrammarTest.kt::m5B03_claimReviewWords
  - apps/field-android/app/src/test/kotlin/com/scmtips/field/app/look/ClaimReviewTest.kt::m5B03_aStaleETagOrAnExpiredConfirm_changesNothingAndFetchesAgain
  - apps/field-android/app/src/test/kotlin/com/scmtips/field/app/session/ConductorLookTest.kt::m5B03_approveOrRejectOutsideAReview_startsTheClaimsReview_neverTheAssistant
  frs: []
  verified_at: null
  note: >-
    The M4 approval flow's structure on Field's own API (contract §3, no core): it reuses feature-decisions' DecisionEar
    (UtteranceInbox), DecisionDisplay (the phone card) and AudioOut (SpeechWaiter); no DAT wrapper is duplicated. The
    phone keeps its own 10 s window from the read-back and never sends a late confirm; the server's confirm_by is the
    authority. Aligned with stream X's deviations (lead, 1 Nov): If-Match on /decision and /confirm (the list item's
    etag, else GET /v1/claims/{id}'s ETag header; the confirm uses the ETag the decision answered; 412 drops it and
    fetches again; 422 FIELD-CLM-422-CONFIRM-EXPIRED and 403 other-supervisor are spoken, nothing changes), confirm
    body {words}, GET /v1/claims?status=draft&limit=50 {items, count}, POST /v1/claims 200 or 201. ASSUMPTION: GET
    /v1/claims/{id} exists and answers the claim's ETag (the list may carry no per-item ETag). One path per flow: the
    claims endpoints directly; the app never sends look_id in the assistant's client_state, and "approve" / "reject"
    outside a review start the review instead of reaching the assistant's server-side claim intents. Who decides is
    the server's: operators may list (field.claim.read), so the Today card hides after a decision answers 403, or when
    the list answers 403/404. Coded against a scripted field-api; stream X's routes were not called. Nothing ran on the
    phone or the glasses.
