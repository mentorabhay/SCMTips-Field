- id: M5-J01
  title: >-
    Hosted field console sign-in through the SCMTIPS core (hud.scmtips.com): e-mail + password on the login page, the
    console's server calls the core's app token and field-api's exchange, tokens in httpOnly cookies, field-api
    exchanges a web console's core token without a device binding
  workstream: M5
  role: Console sign-in (M5 console session)
  status: partial
  evidence:
  - apps/field-console/lib/coreSignIn.ts
  - apps/field-console/lib/consoleAuthHandlers.ts
  - apps/field-console/lib/coreSignInClient.ts
  - apps/field-console/lib/fieldCookie.ts
