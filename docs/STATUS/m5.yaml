  note: >-
    The proposal only pre-fills; what posts is the operator's own numbers and "yes". Posting shape is an ASSUMPTION for
    the integrator (contract §2 names look_id and a per-line flag_qty but no field placement): POST /v1/count-records
    carries value = good + flagged, flag_qty, look_id and capture_id (only after a look or a spoken flag; without them
    the body is the M4 one), and POST /v1/tasks/{id}/post-requests carries look_id at top level; staged_hash is
    unchanged (over counted_qty). The evidence link is POST /v1/evidence/documents/{doc}/link with {year} when erp.posted
    carried doc_year or year; the answer's url (or evidence_url / link) is opened in an in-app WebView (platform
    android.webkit, JavaScript off). Numbers said as words parse through core-voice's NumberWordParser. Nothing ran on
    the phone or the glasses.
