  verified_at: null
  note: >-
    Coded against M5_CONTRACT §2 with a scripted field-api in test code (ScriptedFieldApi); stream V's route was not
    called. The photo goes through the existing captures API unchanged (POST /v1/captures/uploads, PUT the bytes, POST
    /v1/captures with crop_upload_id, code_type look, a unique code_value per photo, blur_applied true): faces are found
    with Android's own android.media.FaceDetector and pixelated with FaceBlurStage's rules (>= 0.30, +10 %, 16 px), and a
    photo whose face check fails is not uploaded. A look photo is at most 640 px on its long side like a capture crop
    (FR2.066): label reads of small print (pack size, expiry) may need a close look; a larger look photo is a privacy-rule
    change for the owner. A 403 FIELD-CAP-403-NO-CONSENT asks once per site ("I agree" or Agree) and records POST
    /v1/consents. Outlines are drawn from image pixels with letterboxing (the look's image size, else the uploaded photo).
    Nothing ran on the owner's phone or the glasses; the glasses photo path (DatGlasses.capturePhoto, toolkit 1.0.1)
    compiles against the real jars but has never run (META_FIELD row 5).
