    Deterministic check of a look (vision/reconcile.py): counts vs the line, pieces per unit vs expected (pieces
    difference), expiry vs the site window (default 90 days), batches; proposal and a number-checked say
  workstream: M5-V
  role: Stream V (vision, posting, cases)
  status: partial
  evidence:
  - services/field-api/src/field_api/vision/reconcile.py
  - services/field-api/src/field_api/vision/say.py
  tests:
  - services/field-api/tests/vision/test_vision_reconcile_property.py::test_m5_v04_property_good_plus_flagged_is_seen_and_pieces_difference
  - services/field-api/tests/vision/test_vision_reconcile_property.py::test_m5_v04_property_expiry_windows
  - services/field-api/tests/vision/test_vision_reconcile_property.py::test_m5_v04_rules_mode_and_contract_example
  frs: []
  verified_at: null
  note: >-
    Hypothesis property: good + flagged = seen; pieces difference = sum of read pieces - expected x reads; every
    number of say is one of the look's figures (briefs.numbers). Flagged = damaged, and on a pharmacy case also
    expired or near expiry; pack-size differences are received and claimed, not flagged. Partial until the two
    cases are proven on the owner's phone and glasses.
