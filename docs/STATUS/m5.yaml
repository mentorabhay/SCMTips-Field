  note: >-
    The M4 approval flow's structure on Field's own API (contract §3, no core): it reuses feature-decisions' DecisionEar
    (UtteranceInbox), DecisionDisplay (the phone card) and AudioOut (SpeechWaiter); no DAT wrapper is duplicated. The
    phone keeps its own 10 s window from the read-back and never sends a late confirm; the server's confirm_by is the
    authority. Who decides claims is the server's: GET /v1/claims?status=draft answering 403 (or 404 on an older
    server) hides the Today card. Coded against the contract with a scripted field-api; stream X's routes were not
    called. Nothing ran on the phone or the glasses.
