  note: >-
    Engine reuse: vision.service gained LookTarget and run_look (stages a-f, one or two steps) shared by the task look
    and the try look; get_look now reads task looks only (a try look is never visible to claims, evidence or
    receipts). Migration field_0067_m5_try (down_revision field_0066_m5_look_stage): vision_look site/task/capture
    nullable for kind 'try' only (ck_vision_look_kind), photo columns, PERMISSIVE policy try_scope, table
    field.try_look_slot (forced RLS) for the rolling-hour rate, SECURITY DEFINER field.worker_purge_try_looks.
    Faces: the browser has no blur gate, so field-api pixelates faces it finds itself (OpenCV Haar cascades, new
    dependency opencv-python-headless 4.14.0.94 resolved into uv.lock; 5.x ships no cascades) before storing and
    before any model call; Haar misses small or turned faces (documented, the page asks not to photograph people).
    Budget: BudgetGuard(scope="try") adds AI_TRY_DAILY_CAP_USD (default 3) per tenant per UTC day, purpose
    try:vision; refusals degrade to rules mode. Idempotency: a multipart body gets a new boundary per request, so a
    repeated Idempotency-Key is 422 KEY-REUSED from the middleware (as for captures); the service itself replays a
    key's stored look. Proven with the Meta API test double and the SAMPLE scene only; partial until the hosted stack
    runs the page with the real Meta key (META_FIELD rows 20, 23 UNVERIFIED) and a judge's browser speaks it.
