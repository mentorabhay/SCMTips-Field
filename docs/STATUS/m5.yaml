  note: >-
    partial until proven with the owner's phone against the hosted core. Flow: the page (/phone, linked in the
    console header; a SCMTIPS sign-in now lands on /phone?signedin=1, the sign-in success page, with "Go to the
    console") posts to POST /api/console-auth/pairing (same-origin only, like the other console-auth routes); the
    server reads the httpOnly cookie scmtips_core_token and calls POST {FIELD_CONSOLE_CORE_URL}/v1/wearable/pairing-codes
    with Authorization Bearer <core token> and X-Requested-With lr (no body, redirect "error" so the bearer is never
    sent elsewhere), and answers {code, expires_at, expires_in, link} with link = {FIELD_CONSOLE_APP_LINK_BASE,
    default https://app.scmtips.com}/pair?code=<code>; expires_in (seconds by the server's clock) is an addition to
    the contract's {code, expires_at, link} so a browser with a wrong clock still counts down right. No token in any
    body or header (tested for 200, 403, 5xx with the token echoed in the core's body, and a fetch error naming
    it). Refusals: no core cookie 401 not_signed_in; core 401 401 session_ended with both token cookies cleared; core
    403 "Your account can't sign in phones."; 429 with Retry-After; 503 / other 5xx / unreachable / malformed answer
    as plain messages; FIELD_CONSOLE_CORE_URL unset 404. Development sign-in (fake-core, no core token): the page
    says it needs SCMTIPS sign-in. The QR is drawn in the page by lib/qr.ts (no QR library is in pnpm-lock.yaml, so
    none was added): byte mode UTF-8, level M, versions 1-10 (213 bytes; the hosted link is 42 bytes, version 3),
    all 8 masks scored by the four penalty rules. Tests freeze matrices from an independent reference (Project
    Nayuki's qrcodegen 1.8.0) for versions 1, 3, 7 and 10 and UTF-8 text; while building, 110 (text, version, mask)
    cases matched qrcodegen and the qrcode package module for module and all were read back by the zxing-cpp decoder,
    as was the SVG path the page draws (scratch tools outside the repository, not a gate). The automatic mask
    choice differs from qrcodegen's in 4 of 20 cases (penalty-rule N3 interpretations differ between
    implementations); every mask decodes. Proven here: vitest (all console tests), tsc --noEmit, next build, and a
    production next start against a stand-in core (correct bearer 200 with the link, wrong bearer 401 with cookies
    cleared, no cookie 401, cross-site 403, /phone 200). UNVERIFIED: the real core accepting the core app token as
    Bearer on /v1/wearable/pairing-codes (a core builder adds it in parallel, contract §4), the phone app's "Scan a
    code from your computer" redeeming the code, and the page in a real browser (no browser in this sandbox).
