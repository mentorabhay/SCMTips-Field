- id: M5-V06
  title: >-
    Receive posting with a look: optional look_id and per-line flag_qty on the post request; good units 101 to
    101A, flagged units 101 to 101Q in one material document, the look linked; 101Q receipts in erp-sim
  workstream: M5-V
  role: Stream V (vision, posting, cases)
  status: partial
  evidence:
  - services/field-api/src/field_api/routes/voice.py
  - services/field-api/src/field_api/tasks/api.py
  - services/field-api/src/field_api/warehouse/receiving/post.py
  - services/field-worker/src/field_worker/warehouse/putaway_tasks.py
  - connectors/sap/src/field_sap/sim/adapter.py
  - connectors/sap/src/field_sap/s4/adapter.py
  - services/erp-sim/src/erp_sim/services/inbound.py
  - services/erp-sim/alembic/versions/erpsim_0006_m5_quality.py
  tests:
  - tests/e2e/test_m5_vision_post_e2e.py::test_m5_v06_grocery_case_look_post_18_good_2_flagged
  - tests/e2e/test_m5_vision_post_e2e.py::test_m5_v06_pharmacy_case_and_a_look_is_posted_once
  - tests/e2e/test_m5_vision_post_e2e.py::test_m5_v06_erp_sim_refuses_an_unknown_quality_location
  - tests/e2e/test_m5_vision_post_e2e.py::test_m5_v06_spoken_flag_without_a_look_and_the_today_starter
  - tests/e2e/test_m3_sandbox_e2e.py::test_sandbox_receipt_new_barcode_soft_pegging_gr_101
  - tests/e2e/test_slice_receive_e2e.py::test_slice_goods_receipt_round_trip
  frs: []
  verified_at: null
  note: >-
    The counted quantity (and staged_hash) stays the whole received quantity: "receive 18, flag 2" is a count of 20
    with flag_qty 2. As the app (stream B) sends it, POST /v1/count-records takes flag_qty, look_id and capture_id
    and keeps the flag on the line (a count without flag_qty clears it), and the post request takes a top-level
    look_id; a flag_qty map on the post request overrides the counted flags. A spoken flag without a look also
    posts to 101Q. Flag at most counted minus damaged. The quality storage location is
    FIELD_QUALITY_SLOC (default 101Q). 101Q existed in erp-sim only as master data of plant 1010; receipts to it are
    new, through the simulator's YY1_QualityQuantity / YY1_QualityStorageLocation item fields. Real S/4 differs
    (UNVERIFIED): it would split the delivery item per storage location or receive into quality inspection stock;
    the S/4 adapter still posts no goods receipt at all. Flagged units are not put away. Without look_id and
    flag_qty the M4 request, staging and jobs are unchanged (the M2/M3/M4 receive tests pass unchanged).
