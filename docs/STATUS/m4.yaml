  note: >-
    Ported from the core's wearable app api/{Models,ScmtipsApi,OkHttpScmtipsApi}.kt. The client logic (paths under
    {core}/v1, Bearer wearable token + X-Device-Id + X-Requested-With lr, Idempotency-Key on commands only, invalid_code vs
    401, problem documents, multipart photo fields) is pure Kotlin over a CoreHttp port and JVM-tested with a scripted
    transport; OkHttpCoreHttp is the only network code. MockWebServer is not in gradle/libs.versions.toml and was not added
    (rule 2.4); OkHttpCoreHttpTest pins the OkHttp layer with a scripted interceptor and runs in the Gradle unit tests (it was
    also compiled and run once here on the plain JVM against okhttp 4.12.0, 4/4 passed; that is not a gate). Models are read
    by hand from JsonObject (the JVM gate has no serialization plugin). Pairing (POST /v1/wearable/sessions) and server
    transcription are not ported: F2 sign-in replaces pairing, and speech is recognised on the glasses or phone. Sign-in
    (POST /v1/auth/app/token) follows handover 01 exactly; a missing claims object falls back to the token's payload. The
    spoken brief calls field-api POST /v1/briefs/spoken as stream M built it (Authorization field token, Idempotency-Key,
    X-Core-Token, X-Device-Id; decision_id ^[A-Za-z0-9._:-]{1,128}$, template_text 1-4000, else nothing is sent) and speaks the
    template on any 4xx/5xx, transport error, blank text or after 8 s. A wrong pairing code and 429 too_many_attempts get their own
    words. The core app's own pairing (POST /v1/wearable/sessions, 8-character code, user_display_name) is ported as a fallback
    for a core that does not serve /v1/auth/app/token (404/405/501): decisions only. Voice transcription is not used (the stand-in
    does not serve it). Nothing has been called against the real core or the stand-in core (stream C), and
    nothing ran on the owner's phone or glasses.
