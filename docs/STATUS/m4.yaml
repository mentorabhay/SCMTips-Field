  frs: []
  verified_at: null
  note: >-
    Owner's field-api log of 31 Oct 2026 (every turn tried Muse first, AI_TIMEOUT after 6 s, once AI_TRANSPORT, then
    rules; Start Work answered 6-7 s late). needs_model() sends to the model only an utterance the rules cannot classify
    (outside a dialog) and "what is this" about a photo without a code; session start/end, pause, resume, step done,
    scan, unknown code, every open dialog and every classified utterance are answered by rules with zero model calls
    (test with the AI on and a model double that would answer, plus the budget ledger). Measured on the build machine
    through TestClient + Postgres, 21 rules-first turns: median 53 ms, max 149 ms. A model that does not answer costs
    at most the deadline (real local HTTP server, deadline 1.5 s: answered by rules after about 1.7 s). The model is no
    longer offered add_sandbox_item (it could add after an explicit yes); adds happen only in the rules dialog, a model
    that calls it gets "unknown tool". Model-turn tests that used rules-classified turns now use unclassified utterances
    (docstrings say why; behaviour change asked for by the owner, not a weakening). Partial until proven on the
    owner's phone and glasses and with the real Meta API (A-04).
- id: M4-M02
