  - apps/field-android/feature-decisions/src/test/kotlin/com/scmtips/field/feature/decisions/flow/ApprovalFlowTest.kt::stoppingTheReview_clearsTheCard_andSendsNothingMore
  - apps/field-android/feature-decisions/src/test/kotlin/com/scmtips/field/feature/decisions/flow/CardFormatterTest.kt::decisionCard_truncatesBody_andHasOneApprovePerOptionPlusReject
  - apps/field-android/feature-decisions/src/test/kotlin/com/scmtips/field/feature/decisions/flow/LaunchCoordinatorTest.kt::aLaunchFromTheGlasses_isAcknowledged_andStartsTheReview
  - apps/field-android/feature-decisions/src/test/kotlin/com/scmtips/field/feature/decisions/flow/UtteranceInboxTest.kt::wordsHeardWhileListeningAreTaken_andWordsHeardBeforeAreDropped
  frs: []
  verified_at: null
  note: Ported from the core's wearable app flow/{ApprovalFlow,CardFormatter,LaunchCoordinator,StepUpPrompter}.kt and
    ui/StepUpBroker.kt with their tests (runBlocking instead of kotlinx-coroutines-test, which is not a dependency). Rebuilt on
    Field's modules, no second glasses wrapper - speech out is core-wearables AudioOut (the app plays it through its TTS,
    which reaches the glasses' speakers over Bluetooth), speech in is a core-voice AsrCandidate from a DecisionEar the app
    feeds (glasses mic in a work session, hold-to-talk otherwise), the card is a phone card (Ray-Ban Meta Gen 2 has no display;
    the core app's CardRenderer used mwdat-display, which is not a Field dependency, so it is not ported). Changes - the brief
    is fetched before the challenge so the nonce's life is not spent on the model; committed and errors are confirmed by an
    earcon plus the core's words; a stopped review clears the card. The core's grammar decides every intent; the app never
    decides an approval, a permission or whether step-up is needed. The server-transcriber below_floor case of the original
    test is gone with server transcription. Not run on the glasses, the stand-in core or the real core.
