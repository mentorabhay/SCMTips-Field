    The access token is exchanged at field-api /v1/auth/exchange; as stream C built it, the exchange itself registers or links the
    field device of a core-signed-in phone and answers its device_id (no POST /v1/devices, which answers 409), and its
    core_permissions are merged into the account. Tokens and the wearable session live in the app's EncryptedSharedPreferences
    (scmtips-field-slice) and no class that holds them prints them; sign-out (Me) revokes the wearable session at the core (best
    effort) and removes every secret. Homes - Decisions when the core grants approve_decisions or voice.approve, field work when it
    grants field_operator or field.operate; the site is the first of the token's sites field-api lists, else the first listed (the
    stand-in sends sites ["*"]). Version 6 / 0.5.0-m4. Only type-checked (compile_check --all) and JVM-tested; no Gradle build or
    lint here (no Android SDK licence), never run on a phone, never called against the stand-in or the real core.
