  note: >-
    Against the stand-in core; the real core is not deployed. A dev double (docstrings and tools/fake-core/README.md
    say so), never presented as the core. Serves the handover paths (01, 01a) with the ported ARO client's shapes
    (api/Models.kt), which win where they differ; where neither gives a shape (brief bodies, sessions list, feed answer)
    the stand-in's choice is listed in the README. Ed25519 key made at start-up, kid scmtips-core-ed25519-standin-<hash>;
    /v1/core/jwks.json carries it and the legacy dev key, /.well-known/jwks.json keeps the legacy key only. Demo users
    approver (voice.approve) and operator, password FAKE_CORE_DEMO_PASSWORD (dev value), step-up code
    FAKE_CORE_STEP_UP_CODE. Feed receivers verify X-SCMTIPS-Timestamp (<= 300 s) and the HMAC-SHA256 signature over
    timestamp + "." + raw body, check rows against the exchange contract's inventory / open_supply columns and keep
    them (upsert view, read at /_standin/feeds/*). State is process memory. Partial until the same flows run against
    the real core and on the owner's phone and glasses (A-04).
    K1 (31 Oct 2026), after Field's smokes ran against the real core (M4-C13): the stand-in now answers as the real core
    did - decision statuses PENDING_APPROVAL / APPROVED / REJECTED (was open / approved / rejected; the core then moves
    an approved decision to EXECUTING, not modelled), the read-back's pending as the core's PendingOut (intent,
    option_id, letter, reason, review_at, readback; was option), a cancel that keeps the review going (next turn
    issued), and 404 voice_challenge_unknown / 409 voice_nonce_replayed / 410 voice_challenge_expired / 409
    voice_not_actionable for an unknown or another session's, a used, an expired challenge and a decided decision (was
    409 challenge_expired / decision_closed). The app does not branch on these (CoreException), so no app change.
