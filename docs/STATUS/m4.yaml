  - services/field-api/tests/assistant/test_spoken_briefs.py::test_model_failures_speak_the_template
  - services/field-api/tests/assistant/test_spoken_briefs.py::test_model_gets_the_four_second_deadline
  - services/field-api/tests/assistant/test_spoken_briefs.py::test_missing_headers_speak_the_template_without_any_call
  - services/field-api/tests/assistant/test_spoken_briefs.py::test_core_token_is_never_stored_or_logged
  - services/field-api/tests/assistant/test_spoken_briefs.py::test_permission_validation_and_idempotency
  - services/field-api/tests/assistant/test_spoken_briefs.py::test_a_rewrite_with_a_new_number_is_always_refused
  frs: []
  verified_at: null
  note: >-
    Permission field.assistant.use (operator, technician, supervisor; field_api/auth is stream C's, so no new
    permission was added); route_auth passes; POST needs Idempotency-Key like every write. Headers X-Core-Token and
    X-Device-Id; a missing one answers the template with missing:x_core_token / missing:x_device_id and makes no call.
    One Muse call through the router and the budget guard (purpose brief, deadline 4 s); off, no key, over budget,
    refused or image model, HTTP error, timeout, cut-off or empty answer, or more than 150 words -> template with
    model:* / local:too_long. The local check reads numbers in digits and in words: every number said must be in the
    template and none of the template's may be dropped (local:number_not_in_template:N, local:number_dropped:N); a
    local refusal never calls the core. The core check gets Authorization Bearer <X-Core-Token> and X-Device-Id;
    refused -> its reasons (core:*) and its template_text when given; HTTP error, timeout, transport, bad JSON ->
    core:http_N / core:timeout / core:transport / core:bad_response. The token is never stored, logged or sent to the
    model (test greps stdout/stderr, ops.ai_usage and field.idempotency_record). UNVERIFIED against the real core and
    the real Muse prompt (META_FIELD rows 20, 21); partial until proven with the owner's glasses and the real core.
    K1 (31 Oct 2026) against the REAL core: POST /v1/briefs/spoken answered the core's template with reasons
    [model:meta:AI_CLOUD_DISABLED] (no model key in this container), so the rewrite never reached the core check; the
    check client itself was called against the real core by the smoke (template accepted, a changed figure refused;
    META_FIELD row 21 VERIFIED for a local core). The core check refused its own template when net cost = committed
    spend; fixed on the core (6ea7c29), after which the smoke passed on that decision.
