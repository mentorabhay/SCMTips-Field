  - services/field-api/tests/assistant/test_assistant_rules_first.py::test_bins_match_as_spoken
  - services/field-api/tests/assistant/test_assistant_rules_first.py::test_new_home_receipt_creates_and_opens_it
  - services/field-api/tests/assistant/test_assistant_rules_first.py::test_production_site_refuses_new_work_politely
  - services/field-api/tests/assistant/test_assistant_rules_first.py::test_count_a_shelf_asks_which_then_creates
  - services/field-api/tests/assistant/test_assistant_rules_first.py::test_count_shelf_through_the_real_sandbox_service
  - services/field-api/tests/assistant/test_assistant_rules_first.py::test_nothing_assigned_offers_new_work_on_sandbox_sites
  - services/field-api/tests/assistant/test_assistant_rules_first.py::test_new_work_failures_are_spoken
  - tests/e2e/test_m3_sandbox_e2e.py::test_assistant_starts_new_home_work_through_the_real_sandbox_service
  frs: []
  verified_at: null
  note: >-
    Owner's field test of 31 Oct 2026 (after the home receipt and count the site had no open jobs and the app said
    "nothing assigned" with no way to start new work). Two new seams in assistant/ports.py (create_receipt,
    create_count, like section 7 of M3_CONTRACT) wired in get_ports to field_api.sandbox.service.create_receipt /
    create_count; rules answer them (no model call) and return open_task for the new task. "count a shelf" asks
    "Which shelf? Say HOME-A or HOME-B." (one shelf - no question) and takes the next utterance or a scanned shelf label;
    spoken bins match after digit words and separators are dropped, or by a unique ending ("shelf b" -> HOME-B).
    Production sites refuse politely and nothing is created. Greeting, what's next, most urgent, how many left and help
    offer both on sandbox sites when nothing is open. e2e against in-process erp-sim (real delivery, real count).
    Partial until proven on the owner's phone and glasses (A-04).
