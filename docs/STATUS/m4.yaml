    "nothing assigned" offers both on sandbox sites
  workstream: M4-F3
  role: Stream M
  status: partial
  evidence:
  - services/field-api/src/field_api/assistant/rules.py
  - services/field-api/src/field_api/assistant/ports.py
  - services/field-api/src/field_api/assistant/tools.py
  - services/field-api/src/field_api/assistant/work.py
  tests:
