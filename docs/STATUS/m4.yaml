  - tools/dev_stack/tests/test_erp_feed.py::test_m4_c15_compare_names_each_difference_and_ignores_what_only_the_core_holds
  - tools/dev_stack/tests/test_erp_feed.py::test_m4_c15_smoke_erp_feed_routes_to_the_erp_feed_smoke
  - services/field-worker/tests/unit/test_core_feeds.py::test_m4_c10_a_stale_stock_retry_is_dropped_once_a_newer_row_is_delivered
