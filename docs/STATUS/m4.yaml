  - connectors/sap/tests/contract/test_read_port_contract.py::test_m4_c03_unknown_document_and_bad_filter_are_errors
  - connectors/sap/tests/contract/test_read_port_contract.py::test_m4_c03_s4_adapter_conforms_and_refuses_reads
  frs: []
  verified_at: null
  note: The F4 feed rows are read from the ERP through the port, not computed. ErpReadPort is a separate protocol so the
    ErpPort test doubles stay as they are. erp-sim (migration erpsim_0004) keeps the PO line of an ASN item
    (ReferenceSDDocument/Item in S/4) and carries it into the GR item, read as A_MaterialDocumentItem.PurchaseOrder /
    PurchaseOrderItem; on-hand is A_MatlStkInAcctMod (unrestricted, InventoryStockType 01; erp-sim has one quantity per
    material, plant and storage location). The S/4 adapter raises NotImplementedError for both reads (UNVERIFIED, no
    S/4 system), like its postings.
- id: M4-C04
  title: 'F4: GR 101 -> the core''s inventory and open-supply feeds, signed, idempotent on the event id, retried, dead-lettered'
  workstream: M4-C
  role: Stream C (core link)
  status: partial
  evidence:
  - services/field-api/alembic/versions/field_0062_m4_core.py
  - services/field-worker/src/field_worker/core_feeds/publisher.py
  - services/field-worker/src/field_worker/core_feeds/rows.py
  - services/field-worker/src/field_worker/core_feeds/signing.py
  - services/field-worker/src/field_worker/core_feeds/config.py
  - services/field-worker/src/field_worker/core_feeds/codes.py
  - services/field-worker/src/field_worker/worker.py
  tests:
  - services/field-worker/tests/unit/test_core_feeds.py::test_m4_c04_gr_101_delivers_two_signed_rows_read_from_the_erp
  - services/field-worker/tests/unit/test_core_feeds.py::test_m4_c04_nothing_without_both_urls
  - services/field-worker/tests/unit/test_core_feeds.py::test_m4_c04_retry_with_backoff_then_dead_letter_and_permanent_refusal
  - services/field-worker/tests/unit/test_core_feeds.py::test_m4_c04_a_retry_waits_for_its_backoff
  - services/field-worker/tests/unit/test_core_feeds.py::test_m4_c04_sandbox_receipts_are_skipped_unless_switched_on
  - services/field-worker/tests/unit/test_core_feeds.py::test_m4_c04_core_codes_from_the_mapping_file
  - services/field-worker/tests/unit/test_core_feeds.py::test_m4_c04_rows_aggregate_and_storage_location_mapping
  - services/field-worker/tests/unit/test_core_feeds.py::test_m4_c04_worker_builds_the_publisher_only_with_both_urls
  - services/field-worker/tests/unit/test_core_feeds.py::test_m4_c04_property_signature_verifies_and_detects_tampering
  frs: []
  verified_at: null
  note: Against the stand-in core; the real core is not deployed. Source event is the existing outbox event erp.posted
    with data.doc_type GoodsReceipt (movement 101), emitted by the posting worker. Staging reads the posted document
    and the on-hand after it from erp-sim through ErpReadPort and stores the exact JSON body per feed in
    field.core_feed_delivery (migration field_0062, forced RLS, UNIQUE tenant+event+feed). Delivery signs with
    X-SCMTIPS-Timestamp / X-SCMTIPS-Signature (HMAC-SHA256 of timestamp + "." + body), Idempotency-Key
    <event_id>:<feed>; 400/413/415/422 dead at once, other failures retried with exponential backoff (+-20 % jitter)
    up to FIELD_CORE_FEED_MAX_ATTEMPTS (8), then dead. Nothing is staged or sent unless both feed URLs are set; a URL
    without its secret is refused. Assumptions (handover gives one example row each): as_of = due_date = posting
    date, qty = quantity received on that PO line, PO ref <PO>-<item without leading zeros>, several items aggregated
    per row key, a receipt without a PO reference sends the stock row only, sandbox receipts skipped unless
    FIELD_CORE_FEED_SANDBOX, history older than FIELD_CORE_FEED_LOOKBACK_H (24 h) not replayed. Codes as erp-sim has
    them (upper-cased) or mapped by FIELD_CORE_CODE_MAP (JSON: materials, locations by plant or plant/sloc). Reversals
    (102) are not sent. Partial until delivered to the real core's feeds (A-04).
- id: M4-C05
  title: stack seed-core-export <dir>, a tolerant loader of the core's erp-sim export (CSV + JSON) into erp-sim
  workstream: M4-C
  role: Stream C (core link)
  status: partial
  evidence:
  - tools/dev_stack/core_export.py
  - tools/dev_stack/stack.py
  tests:
  - tools/dev_stack/tests/test_core_link.py::test_m4_c05_seed_core_export_missing_folder_is_a_clear_failure
  - tools/dev_stack/tests/test_core_link.py::test_m4_c05_export_json_envelope_and_csv_load_into_erpsim
  frs: []
  verified_at: null
  note: The core's export (ARO\samples\exports\erp-sim) does not exist yet, so its layout is assumed and the loader is
    tolerant; tested with the exchange contract's own erp_extract example plus CSV files. Recognises erp_extract
    envelopes (parts), objects of tables, row lists and CSV, tables items / locations / inventory / open_supply by
    file or key name (aliases), bom and unknown tables reported and ignored. Loads the core's codes as erp-sim's own
    codes (plants, one storage location per plant FIELD_CORE_EXPORT_SLOC=0001, materials with barcode = code,
    absolute on-hand, one ASN per open PO with items referencing the PO lines). Re-runs are safe. Missing folder ->
    exit 1 with where the core writes it. A field site per core plant is not created by it (next step printed).
    Partial until run on the core's real export.
