  - services/field-api/tests/unit/test_m4_core_exchange.py::test_m4_c01_exchanged_approver_may_use_the_spoken_brief
  - services/field-api/tests/property/test_pr1_17_token_exchange.py::test_t1_038_device_exchange_requires_active_device_row
  frs: []
  verified_at: null
  note: Against the stand-in core; the real core is not deployed. Settings FIELD_CORE_BASE_URL (default
    http://127.0.0.1:8011, the stand-in), FIELD_CORE_JWKS_URL (default {BASE}/v1/core/jwks.json),
    FIELD_CORE_DEVICE_STATUS_URL (template {device_id}, {tenant_id} from the token; unset keeps today's behaviour,
    fake-core /api/v1/devices/{id}/status when CORE_API_URL is set). JWKS re-read once on an unknown kid or a failed
    signature, at most every FIELD_JWKS_FORCED_REFRESH_MIN_S (5 s). permissions / email claims accepted (validated,
    permissions echoed as core_permissions, e-mail never stored). The core's device id (app install id) is not a
    field.device id; the field device for it is the field.device whose id or serial_no equals it, registered by the
    exchange when the core device status answers active (the app then uses the device_id the exchange returns and
    does not POST /v1/devices for it). Roles must still be field roles (unknown roles stay refused); the stand-in
    approver carries field.supervisor, which holds field.assistant.use (stream M's POST /v1/briefs/spoken). Partial until
    proven against the real core and on the owner's phone (A-04).
