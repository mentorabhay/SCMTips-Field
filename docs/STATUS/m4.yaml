    has the core's Org admin send the scenario's signal message as the signals workbook CSV (fresh external id and
    event time) to POST /v1/exchange/messages/signal/import-file; the core's own pipeline matched it (Supplier S-02,
    CP-204), passed its relevance gate, scored it HIGH, ran the exposure cascade (CP-204 -> SA-120 -> FG-100, FG-200;
