  - services/field-api/tests/assistant/test_assistant_rules_first.py::test_unclassified_turn_gives_the_model_only_the_deadline
  - services/field-api/tests/assistant/test_assistant_rules_first.py::test_slow_model_falls_back_within_the_deadline
  - services/field-api/tests/assistant/test_assistant_model_turns.py::test_sandbox_items_are_added_only_by_the_rules_dialog
