  - services/field-worker/tests/unit/test_core_feeds.py::test_m4_c04_nothing_without_both_urls
  - services/field-worker/tests/unit/test_core_feeds.py::test_m4_c04_retry_with_backoff_then_dead_letter_and_permanent_refusal
  - services/field-worker/tests/unit/test_core_feeds.py::test_m4_c04_a_retry_waits_for_its_backoff
  - services/field-worker/tests/unit/test_core_feeds.py::test_m4_c04_sandbox_receipts_are_skipped_unless_switched_on
  - services/field-worker/tests/unit/test_core_feeds.py::test_m4_c04_core_codes_from_the_mapping_file
  - services/field-worker/tests/unit/test_core_feeds.py::test_m4_c04_rows_aggregate_and_storage_location_mapping
  - services/field-worker/tests/unit/test_core_feeds.py::test_m4_c04_worker_builds_the_publisher_only_with_both_urls
  - services/field-worker/tests/unit/test_core_feeds.py::test_m4_c04_property_signature_verifies_and_detects_tampering
  frs: []
  verified_at: null
  note: >-
    Against the stand-in core; the real core is not deployed. Source event is the existing outbox event erp.posted
    with data.doc_type GoodsReceipt (movement 101), emitted by the posting worker. Staging reads the posted document
    and the on-hand after it from erp-sim through ErpReadPort and stores the exact JSON body per feed in
    field.core_feed_delivery (migration field_0062, forced RLS, UNIQUE tenant+event+feed). Delivery signs with
    X-SCMTIPS-Timestamp / X-SCMTIPS-Signature (HMAC-SHA256 of timestamp + "." + body), Idempotency-Key
    <event_id>:<feed>; 400/413/415/422 dead at once, other failures retried with exponential backoff (+-20 % jitter)
    up to FIELD_CORE_FEED_MAX_ATTEMPTS (8), then dead. Nothing is staged or sent unless both feed URLs are set; a URL
    without its secret is refused. Assumptions (handover gives one example row each), confirmed or corrected by the
    core's reply (TO_FIELD section 4, applied in M4-C10): as_of = due_date = posting date, qty = quantity received
    (confirmed); the PO ref is the core's PO number exactly, mapped by FIELD_CORE_CODE_MAP purchase_orders (corrected:
    no longer <PO>-<item>); body {"rows": [...]}, 409 = delivered, stale stock retries dropped (M4-C10); several items
    aggregated per row key, a receipt without a PO reference sends the stock row only, sandbox receipts skipped unless
    FIELD_CORE_FEED_SANDBOX, history older than FIELD_CORE_FEED_LOOKBACK_H (24 h) not replayed. Codes as erp-sim has
    them (upper-cased) or mapped by FIELD_CORE_CODE_MAP (JSON: materials, locations by plant or plant/sloc). Reversals
    (102) are not sent. Partial until delivered to the real core's feeds (A-04).
    K1 (31 Oct 2026) against the REAL core's two webhook feeds (inventory and open_supply, upsert, made by the core's
    Data and integration owner; secrets only in .env.local): GR 101 in erp-sim against an erp-sim PO mapped to the
    core's PO-26-1005 (CP-207 at PLANT-GOA, 600 open) -> both signed rows answered 202, committed by the core's import
    pipeline (pipeline runs ok, rows 1), the core's line PO-26-1005 open -> received qty 600, CP-207 on-hand 560 -> 1160
    (= erp-sim); an identical PO row sent again within 10 minutes was answered 409 duplicate and counted delivered
    (observed with PO-26-1001, and with PO-26-1002 in the log). Observed on the core (recorded for the core, not changed by Field): the inventory row is
    keyed (item, location, as_of), so a receipt adds a row of today next to the older count and the latest as_of is the
    on-hand; the received PO row replaces the whole line, so its supplier_code and lane_code become empty and its
    due_date the posting date (the core's own receipt_feed_rows sends supplier_code when it has one; erp-sim's ASN
    carries no vendor). Still partial: the owner's kit and phone.
