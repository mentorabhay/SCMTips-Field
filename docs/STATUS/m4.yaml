  verified_at: null
  note: >-
    Design: ErpReadPort gains list_stock(plant) (A_MatlStkInAcctMod, Plant and InventoryStockType 01, paged) and
    list_purchase_order_items(plant) (A_PurchaseOrderItem with Supplier, the schedule line's date and the simulator's
    YY1_ received quantity, last receipt date, supply status and lane); erp-sim keeps purchase orders (erpsim_0005,
    round trip run on a scratch database) and computes the received quantity from the 101 receipts that reference the
    line, net of reversals. ErpSnapshotFeed (field-worker, every FIELD_CORE_SNAPSHOT_INTERVAL_S, 900 s, first at
    start-up; 0 = off; off whenever either feed URL is unset) reads the plants of the active production sites of the
    tenants FIELD_CORE_SNAPSHOT_TENANTS names (empty = all), never a plant a sandbox site uses, and stages only the rows
    whose values were not already staged for the core within FIELD_CORE_SNAPSHOT_RESEND_H (24 h), in deliveries of at
    most FIELD_CORE_SNAPSHOT_BATCH (200) rows in field.core_feed_delivery (doc_number SNAPSHOT-plant, created_at = the
    moment the ERP was read, so receipts and snapshots share one staging order). Stock rows: on-hand per item and
    location, as_of today. PO rows: open lines with the open quantity, the ERP's status and due date, supplier and lane;
    a fully received line as received with the received quantity and the last receipt date. A key two plants produce
    (e.g. a code-mapped plant next to an export-seeded one) is sent by neither (core_snapshot_conflict). Delivery is the
    receipts' publisher (signed, {"rows": [...]}, 409 = delivered, retries, dead letters); its supersede rule now covers
    open-supply rows too, keyed (kind, ref, item_code), so an older "open" row never reopens a line a newer receipt row
    closed. No migration in field-api. Results (log docs/evidence/runs/2026-10-31-k2-erp-export-and-snapshot.txt): the
    worker's start-up snapshot to the real core staged 40 stock + 10 PO rows in 3 deliveries, all 202; smoke --erp-feed
    against the real core PASS (a full snapshot answered 409 duplicate within 10 min and counted delivered; the core's
    on-hand for 40 item/locations and its 10 PO lines equal erp-sim's; a second snapshot staged nothing); after the GR of
    PO-26-1002 one snapshot row (the received line with supplier SUP-S02 and lane L02, which the receipt row had left
    empty at the core) and no stock row; smoke --erp-feed against the stand-in PASS. The snapshot made erp-sim the
    system of record at the core: K1's earlier receipts of PO-26-1002 and PO-26-1005 (against a code-mapped erp-sim
    plant) were reopened to open 1600 / 600. Partial: not run on the owner's PC kit; the S/4 reads are UNVERIFIED (the S/4
    adapter refuses them; S/4 keeps the received quantity in the PO history, not on A_PurchaseOrderItem); the worker's
    interval was proven only at start-up, not on a later tick.
