# Declarative SAP OData Mapping: Inbound Delivery
# Service: API_INBOUND_DELIVERY_SRV (OData v2)
# Verification Status: Every field marked VERIFIED or UNVERIFIED per FR3.042

service:
  name: API_INBOUND_DELIVERY_SRV
  version: "2.0"
  namespace: sap
  base_path: /sap/opu/odata/sap/API_INBOUND_DELIVERY_SRV

entities:
  A_InbDeliveryHeader:
    description: Inbound delivery document header
    key: [DeliveryDocument]
    fields:
      delivery_document:
        sap_property: DeliveryDocument
        type: Edm.String
        max_length: 10
        status: VERIFIED
      receiving_plant:
        sap_property: ReceivingPlant
        type: Edm.String
        max_length: 4
        status: VERIFIED
      storage_location:
        sap_property: StorageLocation
        type: Edm.String
        max_length: 4
        status: VERIFIED
      goods_movement_status:
        sap_property: OverallGoodsMovementStatus
        type: Edm.String
        max_length: 1
        status: VERIFIED
      goods_receipt_status:
        sap_property: OverallGoodsReceiptStatus
        type: Edm.String
        max_length: 1
        status: VERIFIED

  A_InbDeliveryItem:
    description: Inbound delivery line item
    key: [DeliveryDocument, DeliveryDocumentItem]
    fields:
      delivery_document:
        sap_property: DeliveryDocument
        type: Edm.String
        max_length: 10
        status: VERIFIED
      item_no:
        sap_property: DeliveryDocumentItem
        type: Edm.String
        max_length: 6
        status: VERIFIED
      material_no:
        sap_property: Material
        type: Edm.String
        max_length: 40
        status: VERIFIED
      delivery_qty:
        sap_property: ActualDeliveryQuantity
        type: Edm.Decimal
        precision: 13
        scale: 3
        status: VERIFIED
      movement_qty:
        sap_property: ActualGoodsMovementQty
        type: Edm.Decimal
        precision: 13
        scale: 3
        status: VERIFIED
      uom:
        sap_property: DeliveryQuantityUnit
        type: Edm.String
        max_length: 3
        status: VERIFIED
      storage_bin:
        sap_property: StorageBin
        type: Edm.String
        max_length: 10
        status: UNVERIFIED

function_imports:
  PostGoodsReceipt:
    http_method: POST
    parameters:
      delivery_document:
        sap_param: DeliveryDocument
        type: Edm.String
        status: VERIFIED
    return_type: A_InbDeliveryHeader
    status: VERIFIED

  PutawayItem:
    http_method: POST
    parameters:
      delivery_document:
        sap_param: DeliveryDocument
        type: Edm.String
        status: VERIFIED
      item_no:
        sap_param: DeliveryDocumentItem
        type: Edm.String
        status: VERIFIED
      storage_bin:
        sap_param: StorageBin
        type: Edm.String
        status: UNVERIFIED
    return_type: A_InbDeliveryItem
    status: VERIFIED
