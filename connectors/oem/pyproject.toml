[project]
name = "field-oem-connector"
version = "0.1.0"
description = "SCMTIPS Field OEM port (M5 case C3) with the OEM-simulator adapter, the refusing real-OEM adapter and a test double"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    "cryptography>=43.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/field_oem", "src/field_oem_testing"]
