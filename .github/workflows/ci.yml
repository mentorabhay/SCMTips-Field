name: ci

on:
  push:
    branches: [main, "slice/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only used to publish sanitized build logs to the ci-logs branch

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every step runs through scripts/ci/logged.sh, which keeps the step's full output in ci-out/<name>.log;
# the last step of each job publishes ci-out/ to the ci-logs branch (runs/<job>/<run>-<attempt>/), so the
# build can be diagnosed from git without the Actions log API.
# Setup actions use `if: success() || failure()` so one failing check never hides the others.

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev-postgres-password
        ports: ["5450:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: dev-postgres-password
      # App and tests connect as the non-superuser, NOBYPASSRLS role so RLS is really exercised.
      FIELD_DATABASE_URL: postgresql://field_app:devpassword@127.0.0.1:5450/field
      FIELD_ADMIN_DATABASE_URL: postgresql://postgres:dev-postgres-password@127.0.0.1:5450/field
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20   # conventions checks the last 10 commits
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # A plain Gradle distribution on PATH: kotlin_jvm.py uses the kotlinc and JUnit 4 jars it ships
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Init databases and roles
        run: scripts/ci/logged.sh initdb psql -h 127.0.0.1 -p 5450 -U postgres -v ON_ERROR_STOP=1 -f tools/initdb/01-init.sql
      - name: Install Python (frozen lockfile)
        run: scripts/ci/logged.sh uv-sync uv sync --frozen
      - name: Install JS (frozen lockfile)
        if: success() || failure()
        run: scripts/ci/logged.sh pnpm-install pnpm install --frozen-lockfile
      - name: Tool versions
        if: success() || failure()
        run: scripts/ci/logged.sh versions bash -c 'uv run python --version; uv run pytest --version; uv run ruff --version; uv run mypy --version; java -version 2>&1; gradle --version; node --version; pnpm --version; uvx semgrep==1.181.0 --version'
      - name: Lint
        if: success() || failure()
        run: scripts/ci/logged.sh lint uv run ruff check .
      - name: Alembic round-trip (migrator = admin role)
        if: success() || failure()
        env:
          FIELD_DATABASE_URL: postgresql://postgres:dev-postgres-password@127.0.0.1:5450/field
        run: scripts/ci/logged.sh alembic uv run python scripts/jobs/alembic.py
      - name: Typecheck (mypy --strict + tsc --noEmit)
        if: success() || failure()
        run: scripts/ci/logged.sh typecheck uv run python scripts/jobs/typecheck.py
      - name: OpenAPI contract drift
        if: success() || failure()
        run: scripts/ci/logged.sh openapi-drift bash -c 'uv run python tools/export_openapi.py && git diff --exit-code -- packages/field-contract/'
      - name: Honesty gates
        if: success() || failure()
        run: >-
          scripts/ci/logged.sh honesty-gates bash -c 'set -e;
          uv run python tools/checks/no_fake_gates.py;
          uv run python tools/checks/orphans.py;
          uv run python tools/checks/firewall.py;
          uv run python tools/checks/no_inmemory_stores.py;
          uv run python tools/checks/test_exercises_prod.py;
          uv run python tools/checks/names.py;
          uv run python tools/checks/route_auth.py;
          uv run python tools/checks/db_roles.py;
          uv run python tools/checks/test_collection.py'
      - name: Conventions (branch + last 10 commits)
        if: success() || failure()
        run: scripts/ci/logged.sh conventions uv run python tools/checks/conventions.py
      - name: Semgrep (same rule packs as verify-all)
        if: success() || failure()
        run: scripts/ci/logged.sh semgrep uvx semgrep==1.181.0 --config p/python --config p/javascript --config p/typescript --config p/java --config p/secrets --error
      - name: Trivy filesystem scan (trivy.yaml)
        if: success() || failure()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0 (tag resolved via git ls-remote 2026-10-30)
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          exit-code: "1"
          output: ci-out/trivy.log
      - name: Tests (all collected)
        if: success() || failure()
        run: scripts/ci/logged.sh pytest uv run pytest -p no:cacheprovider --junitxml=reports/junit.xml
      - name: Kotlin JVM unit tests (kotlinc + JUnit 4)
        if: success() || failure()
        run: scripts/ci/logged.sh kotlin-jvm uv run python scripts/jobs/kotlin_jvm.py
      - name: Console/package tests (vitest + fast-check)
        if: success() || failure()
        run: scripts/ci/logged.sh vitest pnpm exec vitest run --reporter=default --reporter=junit --outputFile.junit=reports/junit-vitest.xml
      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit
          path: |
            reports/junit.xml
            reports/junit-kotlin-jvm.xml
            reports/junit-vitest.xml
      - name: Publish logs to ci-logs branch (agent-readable)
        if: always()
        run: scripts/ci/publish_logs.sh backend "${{ job.status }}"

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/field-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu-24.04 runner image ships the Android SDK (ANDROID_HOME) with its licences already
      # accepted by the image. AGP downloads any missing platform (compileSdk 36) itself.
      - name: Android SDK (runner image)
        run: >-
          ../../scripts/ci/logged.sh android-sdk bash -c 'set -e; echo "ANDROID_HOME=$ANDROID_HOME";
          test -d "$ANDROID_HOME"; ls "$ANDROID_HOME"; ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools";
          ls "$ANDROID_HOME/licenses"; echo "sdk.dir=$ANDROID_HOME" > local.properties'

      # Validates gradle-wrapper.jar against Gradle's published checksums (rule 2.1)
      - uses: gradle/actions/setup-gradle@v4
        if: success() || failure()
        with:
          validate-wrappers: true

      - name: Record Gradle distribution checksum (published by Gradle)
        if: success() || failure()
        run: >-
          ../../scripts/ci/logged.sh gradle-dist-sha bash -c 'url=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | cut -d= -f2 | sed "s#\\\\##g");
          echo "distributionUrl=$url"; echo "published sha256: $(curl -fsSL "${url}.sha256")"'

      - name: Tool versions
        if: success() || failure()
        run: ../../scripts/ci/logged.sh versions bash -c 'java -version 2>&1; ./gradlew --version'

      - name: Assemble debug APK
        if: success() || failure()
        run: ../../scripts/ci/logged.sh assembleDebug ./gradlew assembleDebug --stacktrace

      - name: Unit tests (JUnit 4)
        if: success() || failure()
        run: ../../scripts/ci/logged.sh testDebugUnitTest ./gradlew testDebugUnitTest --stacktrace --continue

      - name: Android lint
        if: success() || failure()
        run: ../../scripts/ci/logged.sh lintDebug ./gradlew lintDebug --stacktrace --continue

      - name: Enforce pinned distribution checksum (rule 2.1)
        if: success() || failure()
        run: >-
          ../../scripts/ci/logged.sh dist-sha-pinned bash -c 'grep -q distributionSha256Sum gradle/wrapper/gradle-wrapper.properties
          || { echo "::error::gradle-wrapper.properties lacks distributionSha256Sum"; false; }'

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: field-debug-apk
          path: apps/field-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            apps/field-android/**/build/reports/**
            apps/field-android/**/build/test-results/**
          if-no-files-found: ignore

      - name: Publish logs to ci-logs branch (agent-readable)
        if: always()
        working-directory: .
        run: scripts/ci/publish_logs.sh android "${{ job.status }}"

  trace:
    needs: [backend, android]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          name: backend-junit
          path: reports/
      - uses: actions/download-artifact@v4
        continue-on-error: true   # absent only when the android job failed before tests; trace then fails D2
        with:
          name: android-reports
          path: apps/field-android/
      - name: Trace (rule 2.3)
        run: uv run python tools/checks/trace.py --junit "reports/junit*.xml" --junit "apps/field-android/**/build/test-results/**/*.xml"
