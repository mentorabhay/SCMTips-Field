[project]
name = "field-worker"
version = "0.1.0"
description = "SCMTIPS Field Asynchronous Background Posting & Sync Worker"
requires-python = ">=3.13,<3.14"
dependencies = [
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    "pydantic-settings>=2.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/field_worker"]
