[project]
name = "oem-sim"
version = "0.1.0"
description = "SCMTIPS Field OEM simulator (M5 case C3): a SAMPLE maker's seal keys, unit registry and first-check claims"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "cryptography>=43.0.3",
    "qrcode>=7.4",
    "structlog>=24.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oem_sim"]
