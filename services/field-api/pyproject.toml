[project]
name = "field-api"
version = "0.1.0"
description = "SCMTIPS Field Core API Service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    "pyjwt[crypto]>=2.9.0",
    "cryptography>=43.0.3",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "pyyaml>=6.0",
    "pillow>=11.0",
    "opencv-python-headless>=4.10,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
field-api = "field_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/field_api", "src/field_common"]
